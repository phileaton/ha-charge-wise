views:
  - title: Charge Wise
    path: charge-wise
    cards:
      - type: entities
        title: Garage Charger
        show_header_toggle: false
        entities:
          - entity: switch.garage_charger_charging_enabled
          - entity: switch.garage_charger_solar_charging
          - entity: switch.garage_charger_off_peak_charging
          - entity: switch.garage_charger_manual_override
          - entity: number.garage_charger_manual_current
          - entity: number.garage_charger_off_peak_current
          - entity: binary_sensor.garage_charger_off_peak_active
          - entity: sensor.garage_charger_next_off_peak_window
          - entity: sensor.garage_charger_controller_status
          - entity: sensor.garage_charger_requested_current
          - entity: sensor.garage_charger_available_solar_budget
          - entity: sensor.garage_charger_decision_reason
          - entity: binary_sensor.garage_charger_battery_protection
      - type: history-graph
        title: Charging controller
        hours_to_show: 24
        entities:
          - entity: sensor.garage_charger_requested_current
          - entity: sensor.garage_charger_available_solar_budget
